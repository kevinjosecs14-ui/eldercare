/* ================= ElderCare+ enhancements ================= */
:root{--text-scale:1}

/* ---- Dashboard / navigation: ONE horizontal bar fixed at the bottom of every screen ---- */
.app-container{display:flex!important;flex-direction:column!important;grid-template-columns:none!important;min-height:100vh;min-height:100dvh}
.app-main{flex:1 1 auto;padding-bottom:calc(128px * var(--text-scale,1) + env(safe-area-inset-bottom,0px))!important}
.app-sidebar{position:fixed!important;left:0!important;right:0!important;bottom:0!important;top:auto!important;width:100%!important;max-width:none!important;height:auto!important;flex-direction:row!important;align-items:stretch!important;justify-content:center!important;gap:10px!important;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))!important;border-radius:20px 20px 0 0!important;border:0!important;border-top:1px solid rgba(255,255,255,.4)!important;box-shadow:0 -10px 30px rgba(11,61,145,.3)!important;background:linear-gradient(135deg,#0b3d91,#1d6fe8)!important;z-index:900!important;overflow:visible!important}
.app-sidebar .sidebar-tab-list{display:flex!important;flex:1 1 auto!important;min-width:0;flex-direction:row!important;gap:0!important}
.app-sidebar .sidebar-items-desktop{display:flex!important;flex-direction:row!important;gap:6px!important;width:100%;overflow-x:auto;scrollbar-width:none;justify-content:center}
.app-sidebar .sidebar-items-desktop::-webkit-scrollbar{display:none}
.app-sidebar .sidebar-items-mobile{display:none!important}
.app-sidebar .nav-item-btn{flex:1 1 0!important;min-width:calc(66px * var(--text-scale,1));width:auto!important;max-width:210px;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:4px!important;padding:8px 6px!important;min-height:64px!important;text-align:center!important;line-height:1.15}
.app-sidebar .nav-label-text{font-size:calc(13px * var(--text-scale,1))!important;line-height:1.15;word-break:break-word;text-align:center}
.app-sidebar .sidebar-sos-wrap{display:flex!important;align-items:stretch;flex:0 0 auto}
.app-sidebar .sidebar-sos-btn{width:auto!important;min-height:64px!important;padding:8px 16px!important;border-radius:16px!important;flex-direction:column;gap:2px}
.mobile-more-backdrop{display:none!important}
.sos-floating-container{bottom:calc(120px * var(--text-scale,1) + env(safe-area-inset-bottom,0px))!important;right:14px!important}
@media (min-width:521px){.sos-floating-container{display:none!important}}
@media (max-width:520px){
  .app-sidebar{gap:6px!important;padding-left:6px!important;padding-right:6px!important}
  .app-sidebar .sos-text-label{display:none}
  .app-sidebar .sidebar-sos-btn{padding:8px 12px!important}
  .app-sidebar .nav-item-btn{min-width:calc(58px * var(--text-scale,1))}
  .app-sidebar .nav-label-text{font-size:calc(11px * var(--text-scale,1))!important}
}

/* ---- A / A+ text size buttons (top bar) ---- */
.text-size-group{display:inline-flex;align-items:stretch;border:2px solid var(--border-color);border-radius:999px;overflow:hidden;background:#fff;flex:0 0 auto}
.text-size-btn{min-width:46px;min-height:44px;padding:0 12px;font-weight:800;color:var(--accent-primary);background:transparent;border:0;cursor:pointer;line-height:1;font-family:var(--font-heading)}
.text-size-a{font-size:16px}
.text-size-aplus{font-size:22px}
.text-size-btn.active{background:var(--accent-primary);color:#fff}
.text-size-btn:focus-visible{outline:3px solid var(--border-focus);outline-offset:-3px}
[data-text-size="large"] .header-controls-cluster{gap:8px}
[data-text-size="large"] .app-header{align-items:flex-start}

/* ---- Greeting card on Home ---- */
.greeting-card{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:20px 24px;border-radius:var(--radius-lg);background:linear-gradient(135deg,#ffffff 0%,#e3eefc 100%);border:2px solid var(--border-color);box-shadow:var(--shadow-md)}
.greeting-icon{font-size:calc(44px * var(--text-scale,1));line-height:1}
.greeting-text{flex:1 1 260px;min-width:0}
.greeting-role{display:inline-block;font-size:calc(13px * var(--text-scale,1));font-weight:800;letter-spacing:.03em;color:var(--accent-primary);background:#fff;border:1px solid var(--border-color);border-radius:999px;padding:3px 12px}
.greeting-title{font-family:var(--font-heading);font-size:var(--font-size-xl);font-weight:800;margin:8px 0 4px;color:var(--color-deep-navy);line-height:1.25}
.greeting-body{font-size:var(--font-size-base);color:var(--text-secondary);font-weight:600;margin:0}
.greeting-voice-warning{margin:10px 0 0;font-size:calc(14px * var(--text-scale,1));background:var(--color-warning-bg);color:var(--color-warning);border-radius:var(--radius-sm);padding:10px 14px;font-weight:700}
.greeting-listen{min-height:52px;padding:0 20px;border-radius:var(--radius-full);background:var(--accent-primary);color:#fff;font-weight:800;font-size:var(--font-size-base);border:0;cursor:pointer}
.greeting-listen:hover{background:var(--accent-primary-hover)}


/* ---- ElderCare+ pictures ---- */
.ec-pic{display:block;width:calc(120px * var(--text-scale,1));height:calc(120px * var(--text-scale,1));margin:0 auto 12px;object-fit:contain;border-radius:50%}
.ec-pic-sm{width:calc(84px * var(--text-scale,1));height:calc(84px * var(--text-scale,1));margin:4px 0 10px}
.ec-guide{margin:0 0 20px;padding:18px;background:var(--bg-surface);border:2px solid var(--border-color);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.ec-guide-title{font-size:calc(19px * var(--text-scale,1));font-weight:800;margin:0 0 14px;color:var(--text-primary)}
.ec-guide-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(150px * var(--text-scale,1)),1fr));gap:14px}

.ec-guide-tile:hover,.ec-guide-tile:focus-visible{border-color:var(--accent-primary);outline:none;box-shadow:0 0 0 3px rgba(29,111,232,.25)}
.ec-guide-img{width:calc(96px * var(--text-scale,1));height:calc(96px * var(--text-scale,1))}
.ec-guide-tile strong{font-size:calc(18px * var(--text-scale,1));font-weight:800}
.ec-guide-tile span{font-size:calc(14px * var(--text-scale,1));line-height:1.35;color:var(--text-secondary)}
